name: PortWatch -> Telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # botao "Run workflow" para rodar na hora
    inputs:
      test:
        description: "Enviar o status atual mesmo sem mudança"
        type: boolean
        default: false

permissions:
  contents: write            # para salvar o state.json de volta no repositorio

concurrency:
  group: portwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Checar o PortWatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python3 portwatch_notify.py ${{ inputs.test && '--test' || '--once' }}

      - name: Salvar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Atualiza estado do lider"
            git push
          fi
